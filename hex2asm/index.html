<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex to ARM Assembly</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Hex to ARM Assembly</h1>
  <p class="note">Paste machine code bytes in memory order, one instruction per 4 bytes. Unknown words show as <code>.word</code>.</p>

  <div class="row">
    <label>Architecture
      <select id="arch">
        <option value="arm64">arm64 (AArch64)</option>
        <option value="arm32">arm32 (A32)</option>
      </select>
    </label>
    <label>Byte order
      <select id="endian">
        <option value="little">little-endian</option>
        <option value="big">big-endian</option>
      </select>
    </label>
  </div>

  <h3>Disassembly</h3>
  <textarea id="bytes" placeholder="One line per listing, e.g.&#10;00 00 80 D2 C0 03 5F D6&#10;20 00 80 D2 C0 03 5F D6" spellcheck="false"></textarea>
  <div class="row"><button id="disasm">Disassemble</button></div>
  <div class="out" id="out"></div>

  <h3>Value to bytes</h3>
  <p class="note">f32 is C <code>float</code>, f64 is <code>double</code>. Output follows the byte order above.</p>
  <div class="row">
    <label>Type
      <select id="type">
        <option>i8</option><option>u8</option>
        <option>i16</option><option>u16</option>
        <option>i32</option><option>u32</option>
        <option>i64</option><option>u64</option>
